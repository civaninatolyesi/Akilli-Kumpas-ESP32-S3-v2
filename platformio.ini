[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
  links2004/WebSockets

; Your ESP32-S3 Super Mini appears to have a 4MB flash (boot log shows 0x400000).
; If partitions are built for 8MB, the chip will fail to boot with:
;   partition invalid ... exceeds flash chip size
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_ota_4mb.csv

; USB CDC serial (works on most ESP32-S3 Arduino builds)
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

; If you have upload issues, you can tweak these:
; upload_speed = 921600
; monitor_port = COMx
